include ~/.local/state/cadrocspace/theme/kitty-style.conf
allow_remote_control yes
listen_on unix:/tmp/kitty

# FONT
#font_family already defined in kitty-style.conf
#font_size already defined in kitty-style.conf
bold_font        auto
italic_font      auto
bold_italic_font auto

# COLOR SCHEME
# A paleta vem do pywal (synced com o wallpaper). Ver includes no fim do arquivo.
# Não defina color0-15 aqui: qualquer valor aqui é sobrescrito pelos includes.

# CONFIGURATION
background_opacity 0.9
window_margin_width 20
confirm_os_window_close 0

cursor_shape beam
cursor_shape_unfocused block
cursor_blink_interval 1
mouse_hide_wait 3.0
cursor_trail 2
cursor_trail_decay 0.1 0.4

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

scrollback_lines 5000
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd

# Include opaque theme config feature
# include ~/.local/state/cadrocspace/theme/opaque/kitty.conf

# Include custom config from cadroccfg

# Cores sincronizadas com o wallpaper (pywal). A ordem importa: o último
# include sobrescreve os anteriores.

# 1) pywal: paleta base do wallpaper (gerada por `wal -i`). Fonte de verdade.
include ~/.cache/wal/colors-kitty.conf

# 2) gerado por ~/.local/bin/kitty-colors.sh (via sequencia.sh): mesmos colores
#    do pywal + bordas, abas e selecao. Fica POR CIMA do include acima para
#    sobrescrever foreground/background/cursor.
include ~/.config/kitty/colors-kitty.conf
